name: Generate Golden Videos

on:
  workflow_dispatch:
  push:
    branches:
      - main  # Only monitor the main branch - change this if you use a different default branch
    paths:
      - 'scripts/config/**'
      - 'golden_sample_yaml_config/**'
      - '.github/workflows/generate-videos.yml'
      - 'scripts/generate_golden_video.py'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v1
        with:
          version: "latest"

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          uv pip install -r requirements.txt

      - name: Setup FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version

      - name: Find config files
        id: find_configs
        run: |
          if [ -d "golden_sample_yaml_config" ]; then
            CONFIG_FILES=$(find golden_sample_yaml_config \( -name "*.json" -o -name "*.yaml" -o -name "*.yml" \) | tr '\n' ' ')
            CONFIG_FILES=$(echo "$CONFIG_FILES" | xargs)
            if [ -z "$CONFIG_FILES" ]; then
              echo "No video config files found in golden_sample_yaml_config/"
              echo "files=" >> $GITHUB_OUTPUT
              echo "found=false" >> $GITHUB_OUTPUT
            else
              echo "Found config files: $CONFIG_FILES"
              echo "files=$CONFIG_FILES" >> $GITHUB_OUTPUT
              echo "found=true" >> $GITHUB_OUTPUT
            fi
          else
            echo "golden_sample_yaml_config directory does not exist"
            echo "files=" >> $GITHUB_OUTPUT
            echo "found=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate videos
        if: steps.find_configs.outputs.found == 'true'
        id: generate
        run: |
          mkdir -p video
          FAILED=0
          FAILED_CONFIGS=""
          for config_file in ${{ steps.find_configs.outputs.files }}; do
            echo "Processing config file: $config_file"
            if ! uv run python scripts/generate_golden_video.py batch \
              --config "$config_file" \
              --output-dir video; then
              FAILED=1
              FAILED_CONFIGS="$FAILED_CONFIGS\n- $config_file"
              echo "❌ Failed to process $config_file" >> $GITHUB_STEP_SUMMARY
            else
              echo "✅ Successfully processed $config_file" >> $GITHUB_STEP_SUMMARY
            fi
          done
          if [ $FAILED -eq 1 ]; then
            echo "failed=true" >> $GITHUB_OUTPUT
            echo "## ❌ Some Config Files Failed" >> $GITHUB_STEP_SUMMARY
            echo "The following config files failed to process:$FAILED_CONFIGS" >> $GITHUB_STEP_SUMMARY
          else
            echo "failed=false" >> $GITHUB_OUTPUT
          fi
          exit $FAILED

      - name: Check for changes
        id: check_changes
        if: steps.find_configs.outputs.found == 'true'
        run: |
          if [ -n "$(git status --porcelain video/)" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Videos were generated or updated"
            git status --short video/
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes to video files"
          fi

      - name: Commit and push videos
        if: steps.check_changes.outputs.changed == 'true' && steps.generate.outputs.failed == 'false'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add video/
          git commit -m "Auto-generate videos from config files [skip ci]" || exit 0
          git pull --rebase || true
          git push || echo "Push failed, may be due to concurrent runs or permissions"

      - name: Summary
        if: always()
        run: |
          if [ "${{ steps.find_configs.outputs.found }}" == "false" ]; then
            echo "## ⚠️ No Config Files Found" >> $GITHUB_STEP_SUMMARY
            echo "No configuration files found in \`golden_sample_yaml_config/\` directory." >> $GITHUB_STEP_SUMMARY
            echo "Add \`.json\` or \`.yaml\` video config files (with \`videos\` array) to trigger video generation." >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.generate.outputs.failed }}" == "true" ]; then
            echo "## ❌ Video Generation Failed" >> $GITHUB_STEP_SUMMARY
            echo "Some config files failed to process. Check the logs above for details." >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.check_changes.outputs.changed }}" == "true" ]; then
            echo "## ✅ Videos Generated Successfully" >> $GITHUB_STEP_SUMMARY
            echo "Videos have been generated and committed to the repository." >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.check_changes.outputs.changed }}" == "false" ]; then
            echo "## ℹ️ No Changes" >> $GITHUB_STEP_SUMMARY
            echo "All videos are up to date. No new videos were generated." >> $GITHUB_STEP_SUMMARY
          fi
