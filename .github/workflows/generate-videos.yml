name: Generate Golden Videos

on:
  workflow_dispatch:
    inputs:
      force_regenerate:
        description: "Re-encode every video even if it already exists"
        type: boolean
        default: false
  pull_request:
    paths:
      - 'scripts/**'
      - 'golden_sample_yaml_config/**'
      - 'requirements.txt'
      - '.github/workflows/generate-videos.yml'
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - 'golden_sample_yaml_config/**'
      - '.github/workflows/generate-videos.yml'

permissions:
  contents: write

# Serialize generate runs: overlapping runs would race committing the same
# video files. Queued runs wait instead of cancelling.
concurrency:
  group: generate-videos-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

jobs:
  # PR schema check: every yaml/json config (golden, example, codecs.yaml
  # via import) must validate. Fast — no ffmpeg needed.
  schema-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate all config files
        run: |
          shopt -s nullglob
          configs=(golden_sample_yaml_config/*.{yaml,yml,json}
                   example_config/*.{yaml,yml,json})
          [ ${#configs[@]} -gt 0 ] || { echo "no config files found"; exit 1; }
          for config in "${configs[@]}"; do
            python scripts/generate_golden_video.py validate --config "$config"
          done
      - name: Schema files match the models
        run: |
          python scripts/generate_golden_video.py schema
          git diff --exit-code config.schema.json config.schema.yaml

  # PR smoke: prove the script and ffmpeg actually encode, without
  # committing any videos.
  smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Smoke-generate one tiny video per scenario
        run: |
          python scripts/generate_golden_video.py test_pattern \
            --resolution 640x480 --fps 30 --codec h264 --duration 1 \
            --preset ultrafast --output-dir /tmp/smoke-out
          python scripts/generate_golden_video.py av_sync \
            --resolution 640x480 --fps 30 --codec h264 --duration 1 \
            --preset ultrafast --output-dir /tmp/smoke-out
          ls -l /tmp/smoke-out

  # Enumerate every video of every golden config into a matrix so encodes
  # run in parallel (veryslow 4K encodes are far too slow for one runner
  # when regenerating everything).
  plan:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: plan
        run: |
          pip install pyyaml
          python - <<'EOF' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          import yaml
          entries = []
          for path in sorted(Path("golden_sample_yaml_config").iterdir()):
              if path.suffix.lower() not in (".yaml", ".yml", ".json"):
                  continue
              config = yaml.safe_load(path.read_text())
              for index in range(len(config["videos"])):
                  entries.append({"config": str(path), "index": index})
          assert entries, "no videos found in golden_sample_yaml_config/"
          print(f"matrix={json.dumps(entries)}")
          EOF

  generate:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Generate one video
        env:
          CONFIG: ${{ matrix.config }}
          INDEX: ${{ matrix.index }}
          FORCE: ${{ inputs.force_regenerate == true }}
        run: |
          python - <<'EOF'
          import os
          import yaml
          config = yaml.safe_load(open(os.environ["CONFIG"]).read())
          single = {
              "videos": [config["videos"][int(os.environ["INDEX"])]],
              "defaults": config.get("defaults", {}),
          }
          if config.get("bits_per_pixel") is not None:
              single["bits_per_pixel"] = config["bits_per_pixel"]
          yaml.safe_dump(single, open("/tmp/one_video.yaml", "w"))
          EOF
          FLAGS=""
          if [ "$FORCE" = "true" ]; then
            FLAGS="--force"
          fi
          python scripts/generate_golden_video.py batch \
            --config /tmp/one_video.yaml --output-dir video $FLAGS
      - name: Collect changed videos
        id: collect
        run: |
          mkdir -p /tmp/new-videos
          git status --porcelain video/ | awk '{print $2}' \
            | xargs -r -I{} cp {} /tmp/new-videos/
          ls /tmp/new-videos
      - uses: actions/upload-artifact@v4
        with:
          name: videos-${{ strategy.job-index }}
          path: /tmp/new-videos/
          if-no-files-found: ignore
          retention-days: 1

  commit:
    needs: generate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Branch tip, NOT the triggering SHA: main may move during the
          # hours the matrix encodes (bit us on the first live run).
          ref: main
      - uses: actions/download-artifact@v4
        with:
          pattern: videos-*
          merge-multiple: true
          path: video/
      - name: Commit and push new videos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add video/
          if git diff --cached --quiet; then
            echo "No new videos to commit"
            exit 0
          fi
          git commit -m "Auto-generate golden videos from config"
          git push || { git pull --rebase && git push; }
