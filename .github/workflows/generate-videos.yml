name: Generate Golden Videos

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/**'
      - 'golden_sample_yaml_config/**'
      - 'requirements.txt'
      - '.github/workflows/generate-videos.yml'
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - 'golden_sample_yaml_config/**'
      - '.github/workflows/generate-videos.yml'

permissions:
  contents: write

jobs:
  # PR validation: prove the script, codecs.yaml, and golden configs work,
  # without committing any videos.
  smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Validate golden config files
        run: |
          python - <<'EOF'
          import sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          from generate_golden_video import (
              load_config, validate_config, validate_config_for_scenario)
          configs = sorted(Path("golden_sample_yaml_config").glob("*.y*ml")) \
              + sorted(Path("golden_sample_yaml_config").glob("*.json"))
          assert configs, "no config files found in golden_sample_yaml_config/"
          for path in configs:
              config = load_config(path)
              validate_config(config)
              validate_config_for_scenario(config)
              print(f"{path}: OK")
          EOF
      - name: Smoke-generate one tiny video per scenario
        run: |
          cat > /tmp/smoke.yaml <<'EOF'
          videos:
            - {resolution: 480p, fps: 30, codec: h264, duration: 1}
          defaults:
            scenario: test_pattern
            preset: ultrafast
          EOF
          python scripts/generate_golden_video.py batch \
            --config /tmp/smoke.yaml --output-dir /tmp/smoke-out
          cat > /tmp/smoke_av.yaml <<'EOF'
          videos:
            - {resolution: 480p, fps: 30, codec: h264, duration: 1}
          defaults:
            scenario: av_sync
            preset: ultrafast
          EOF
          python scripts/generate_golden_video.py batch \
            --config /tmp/smoke_av.yaml --output-dir /tmp/smoke-out
          ls -l /tmp/smoke-out

  # Full generation: only on push to main or manual dispatch. skip_existing
  # in the configs makes this incremental — only missing videos are encoded.
  generate:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Generate videos from golden configs
        run: |
          shopt -s nullglob
          configs=(golden_sample_yaml_config/*.yaml golden_sample_yaml_config/*.yml golden_sample_yaml_config/*.json)
          [ ${#configs[@]} -gt 0 ] || { echo "no config files found"; exit 1; }
          for config in "${configs[@]}"; do
            echo "Processing $config"
            python scripts/generate_golden_video.py batch \
              --config "$config" --output-dir video
          done
      - name: Commit and push new videos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add video/
          if git diff --cached --quiet; then
            echo "No new videos to commit"
            exit 0
          fi
          git commit -m "Auto-generate golden videos from config"
          git push
