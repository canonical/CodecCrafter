# Codec configurations for reproducible golden video generation.
# Schema: encoder, container, speed_type, sc_threshold, keyint_min,
#         extra_essential, codec_params, aliases

h264:
  encoder: libx264
  container: mp4
  speed_type: preset
  sc_threshold: true
  codec_params:
    - "-x264-params"
    - "deterministic=1:no-mbtree=1:no-mixed-refs=1"
  aliases: [h.264, x264]

h265:
  encoder: libx265
  container: mp4
  speed_type: preset
  sc_threshold: true
  codec_params:
    - "-x265-params"
    - "deterministic=1:no-open-gop=1:no-wpp=1:no-pmode=1:no-pme=1"
  aliases: [h.265, hevc, x265]

vp8:
  encoder: libvpx
  container: webm
  speed_type: cpu_used

vp9:
  encoder: libvpx-vp9
  container: webm
  speed_type: cpu_used
  extra_essential:
    - "-tile-columns"
    - "0"
    - "-tile-rows"
    - "0"
    - "-row-mt"
    - "0"

av1:
  encoder: libaom-av1
  container: webm
  speed_type: cpu_used
  aliases: [aom]

mpeg4:
  encoder: mpeg4
  container: mp4
  keyint_min: false
  aliases: [mpeg-4]

mpeg2:
  encoder: mpeg2video
  container: mpg
  keyint_min: false
  aliases: [mpeg-2, mpeg2video]

# ITU-T H.263 baseline only supports fixed picture sizes: 128x96, 176x144,
# 352x288, 704x576, and 1408x1152. Use one of these on the video entry.
h263:
  encoder: h263
  container: 3gp
  keyint_min: false
  aliases: [h.263]

# H.264 with RGB input kept as RGB (High 4:4:4 Predictive profile). Used
# for non-YUV golden samples: set pix_fmt: rgb24 and an output_filename
# (e.g. {res}_{fps}fps_h264_rgb24.mp4), since the default name would be
# {res}_{fps}fps_h264rgb.mp4. H.264 has no alpha, so there is no RGBA form.
h264rgb:
  encoder: libx264rgb
  container: mp4
  speed_type: preset
  sc_threshold: true
  codec_params:
    - "-x264-params"
    - "deterministic=1:no-mbtree=1:no-mixed-refs=1"

# Intra-only; -g is ignored. Use pix_fmt yuvj420p (full-range JPEG) on the
# video entry: the encoder rejects plain yuv420p.
mjpeg:
  encoder: mjpeg
  container: mov
  keyint_min: false
