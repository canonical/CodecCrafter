# Codec configurations for reproducible golden video generation.
# Schema: encoder, container, speed_type, sc_threshold, keyint_min,
#         extra_essential, codec_params, aliases

h264:
  encoder: libx264
  container: mp4
  speed_type: preset
  sc_threshold: true
  codec_params:
    - "-x264-params"
    - "deterministic=1:no-mbtree=1:no-mixed-refs=1"
  aliases: [h.264, x264]

h265:
  encoder: libx265
  container: mp4
  speed_type: preset
  sc_threshold: true
  codec_params:
    - "-x265-params"
    - "deterministic=1:no-open-gop=1:no-wpp=1:no-pmode=1:no-pme=1"
  aliases: [h.265, hevc, x265]

vp8:
  encoder: libvpx
  container: webm
  speed_type: cpu_used

vp9:
  encoder: libvpx-vp9
  container: webm
  speed_type: cpu_used
  extra_essential:
    - "-tile-columns"
    - "0"
    - "-tile-rows"
    - "0"
    - "-row-mt"
    - "0"

av1:
  encoder: libaom-av1
  container: webm
  speed_type: cpu_used
  aliases: [aom]

mpeg4:
  encoder: mpeg4
  container: mp4
  keyint_min: false
  aliases: [mpeg-4]

mpeg2:
  encoder: mpeg2video
  container: mpg
  keyint_min: false
  aliases: [mpeg-2, mpeg2video]

# ITU-T H.263 baseline only supports fixed picture sizes: 128x96, 176x144,
# 352x288, 704x576, and 1408x1152. Use one of these on the video entry.
h263:
  encoder: h263
  container: 3gp
  keyint_min: false
  aliases: [h.263]

# Lossless, intra-only PNG frames in MP4. Used for non-YUV golden samples:
# set pix_fmt to rgb24 or rgba on the video entry (plus an output_filename
# suffix, since both share the {res}_{fps}fps_png.mp4 name). -b:v and -g
# are ignored; size grows with resolution, so keep duration short.
# GStreamer decodes it with qtdemux ! pngdec (gst-plugins-good).
png:
  encoder: png
  container: mp4
  keyint_min: false

# Intra-only; -g is ignored. Use pix_fmt yuvj420p (full-range JPEG) on the
# video entry: the encoder rejects plain yuv420p.
mjpeg:
  encoder: mjpeg
  container: mov
  keyint_min: false
