videos:
  - resolution: 1080p
    fps: 30
    codec: h264
    duration: 10
  - resolution: 1080p
    fps: 60
    codec: h265
    duration: 10
  - resolution: 2160p
    fps: 30
    codec: vp9
    duration: 10

defaults:
  pix_fmt: yuv420p
  test_pattern: testsrc2
  preset: veryslow

bitrate_formula: width * height * fps * 0.1
