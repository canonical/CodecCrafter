# Generated by: scripts/generate_golden_video.py schema
# Same schema as config.schema.json, in YAML for human reading.
$schema: https://json-schema.org/draft/2020-12/schema
title: CodecCrafter batch config
description: 'Batch config for scripts/generate_golden_video.py. Each entry in ''videos''
  is merged over ''defaults'' (video wins) and must end up with fps, codec, duration,
  and a resolution or width+height. Generated by: generate_golden_video.py schema'
type: object
additionalProperties: false
required:
- videos
properties:
  $schema:
    anyOf:
    - type: string
    - type: 'null'
    default: null
    description: Optional reference to config.schema.json for editor support; ignored
      by the generator
    title: $Schema
  videos:
    description: One entry per output video
    items:
      $ref: '#/$defs/video'
    minItems: 1
    title: Videos
    type: array
  defaults:
    $ref: '#/$defs/video'
    description: Values applied to every video unless the video overrides them
  bits_per_pixel:
    anyOf:
    - exclusiveMinimum: 0
      type: number
    - type: 'null'
    default: null
    description: Fallback for videos with no bitrate/bits_per_pixel of their own (default
      0.1)
    title: Bits Per Pixel
$defs:
  video:
    type: object
    additionalProperties: false
    description: One video entry (or the 'defaults' section); scenario-specific keys
      must match the scenario
    properties:
      scenario:
        type: string
        enum:
        - av_sync
        - test_pattern
        default: test_pattern
        description: Generator scenario; set it in 'defaults' (one scenario per config
          file)
      resolution:
        type: string
        pattern: ^\d+[x:]\d+$
        description: Explicit WIDTHxHEIGHT (e.g. 1920x1080); alternative to width+height
      width:
        description: Video width in pixels
        exclusiveMinimum: 0
        title: Width
        type: integer
      height:
        description: Video height in pixels
        exclusiveMinimum: 0
        title: Height
        type: integer
      fps:
        description: Frames per second
        exclusiveMinimum: 0
        title: Fps
        type: integer
      codec:
        description: Codec name or alias from scripts/config/codecs.yaml (h264, h265,
          vp8, vp9, av1, mpeg4, mjpeg, ...)
        title: Codec
        type: string
      duration:
        description: Duration in seconds
        exclusiveMinimum: 0
        title: Duration
        type: number
      bitrate:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        description: Explicit bitrate, e.g. '40M' or '5000k'; wins over bits_per_pixel
        title: Bitrate
      bits_per_pixel:
        anyOf:
        - exclusiveMinimum: 0
          type: number
        - type: 'null'
        default: null
        description: Bitrate = width * height * fps * bits_per_pixel (default 0.1)
        title: Bits Per Pixel
      pix_fmt:
        default: yuv420p
        description: FFmpeg pixel format
        title: Pix Fmt
        type: string
      output_dir:
        default: .
        description: Per-video output directory override; in batch mode the required
          --output-dir flag replaces any defaults-level value
        format: path
        title: Output Dir
        type: string
      output_filename:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        description: Custom output filename; auto-generated as {width}x{height}_{fps}fps_{codec}[_avsync].{ext}
          if omitted
        title: Output Filename
      skip_existing:
        default: true
        description: Skip generation when the output file already exists
        title: Skip Existing
        type: boolean
      preset:
        default: veryslow
        description: FFmpeg speed preset
        title: Preset
        type: string
      extra_params:
        default: []
        description: Extra FFmpeg arguments appended to the command
        items:
          type: string
        title: Extra Params
        type: array
      test_pattern:
        default: testsrc2
        description: FFmpeg lavfi test source (test_pattern scenario only)
        title: Test Pattern
        type: string
      audio_frequency:
        default: 1000
        description: Sine beep frequency in Hz (av_sync scenario only)
        exclusiveMinimum: 0
        title: Audio Frequency
        type: integer
      beep_duration:
        default: 0.1
        description: Beep duration in seconds (av_sync scenario only)
        exclusiveMinimum: 0
        title: Beep Duration
        type: number
